name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run architecture guard
        run: npm run guard

  build-modern:
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install global webOS tools
        run: npm install -g @enact/cli @webos-tools/cli

      - name: Install dependencies
        run: npm ci

      - name: Build modern target
        run: |
          WEBOS_TARGET=modern npm run pack:modern 2>&1 | tee build-modern.log
          EXIT=${PIPESTATUS[0]}
          echo "Modern build exit code: $EXIT"
          ls -la dist/ || echo "No dist directory"
          exit $EXIT

      - name: Upload modern build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-modern-log
          path: build-modern.log
          if-no-files-found: warn

      - name: Package modern IPK
        run: |
          mkdir -p build
          ares-package dist/ -o ./build/ -n
          ls -la build/

      - name: Upload modern IPK
        uses: actions/upload-artifact@v4
        with:
          name: modern-ipk
          path: build/*.ipk
          if-no-files-found: warn

  build-legacy:
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install global webOS tools
        run: npm install -g @enact/cli @webos-tools/cli

      - name: Install dependencies
        run: npm ci

      - name: Build legacy target
        run: |
          WEBOS_TARGET=legacy npm run pack:legacy 2>&1 | tee build-legacy.log
          EXIT=${PIPESTATUS[0]}
          echo "Legacy build exit code: $EXIT"
          ls -la dist/ || echo "No dist directory"
          exit $EXIT

      - name: Upload legacy build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-legacy-log
          path: build-legacy.log
          if-no-files-found: warn

      - name: Package legacy IPK
        run: |
          mkdir -p build
          ares-package dist/ -o ./build/ -n
          ls -la build/

      - name: Upload legacy IPK
        uses: actions/upload-artifact@v4
        with:
          name: legacy-ipk
          path: build/*.ipk
          if-no-files-found: warn
