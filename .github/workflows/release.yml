name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WEBOS_CLI_VERSION: 3.2.3

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install global webOS tools
        run: npm install -g @enact/cli @webos-tools/cli@${WEBOS_CLI_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Build legacy app
        run: |
          node --version
          npm --version
          enact --version
          WEBOS_TARGET=legacy BROWSERSLIST_ENV=legacy npm run pack:legacy 2>&1 | tee build-legacy.log
          EXIT=${PIPESTATUS[0]}
          echo "Legacy pack exit code: $EXIT"
          ls -la dist/ || echo "No dist directory"
          exit $EXIT

      - name: Upload legacy build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-legacy-log
          path: build-legacy.log
          if-no-files-found: warn

      - name: Package legacy IPK
        run: |
          mkdir -p build
          ares-package dist/ -o ./build/ -n
          ls -la build/

      - name: Audit legacy bundle
        run: npm run audit:legacy

      - name: Build modern app
        run: |
          WEBOS_TARGET=modern BROWSERSLIST_ENV=modern npm run pack:modern 2>&1 | tee build-modern.log
          EXIT=${PIPESTATUS[0]}
          echo "Modern pack exit code: $EXIT"
          ls -la dist/ || echo "No dist directory"
          exit $EXIT

      - name: Upload modern build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-modern-log
          path: build-modern.log
          if-no-files-found: warn

      - name: Package modern IPK
        run: |
          ares-package dist/ -o ./build/ -n
          ls -la build/

      - name: Generate manifest.json
        run: node tools/build-manifest.mjs build/*.ipk build/manifest.json

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ipk-and-manifest
          path: |
            build/*.ipk
            build/manifest.json

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.ipk
            build/manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
